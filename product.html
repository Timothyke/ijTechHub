<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/products.js"></script>
<script src="js/nav.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get("id");
  const root = document.getElementById("product-root");
  let currentProduct = null;
  let qty = 1;

  async function init() {
    if (!id) { root.innerHTML = `<p>No product selected.</p>`; return; }
    currentProduct = await fetchProductById(id);
    if (!currentProduct) {
      root.innerHTML = `<p style="color:var(--text-faint);">Product not found.</p>`;
      return;
    }
    const p = currentProduct;
    document.getElementById("page-title-tag").textContent = p.name + " \u2014 ij Tech Hub";
    document.getElementById("crumb-cat").textContent = p.category;
    document.getElementById("crumb-cat").href = "products.html?category=" + p.category;
    document.getElementById("crumb-name").textContent = p.name;

    const onSale = p.compare_at_price && p.compare_at_price > p.price;
    const inStock = p.stock > 0;

    root.innerHTML = `
      <div class="pd-media"><img src="${p.image_url}" alt="${p.name}"></div>
      <div class="pd-info">
        <span class="product-cat">${p.category}</span>
        <h1>${p.name}</h1>
        <div class="pd-rating">
          <span class="star">\u2605\u2605\u2605\u2605\u2605</span> ${p.rating || "\u2014"} (${p.reviews_count || 0} reviews)
        </div>
        <div class="pd-price">
          <span class="price">${money(p.price)}</span>
          ${onSale ? `<span class="price-was">${money(p.compare_at_price)}</span>` : ""}
        </div>
        <p class="pd-desc">${p.description || ""}</p>
        <div class="pd-specs">
          <h4>Specification</h4>
          ${renderSpecStrip(p.specs, 12)}
        </div>
        <div class="qty-row">
          <div class="qty-control">
            <button id="qty-minus" aria-label="Decrease quantity">\u2212</button>
            <span id="qty-val">1</span>
            <button id="qty-plus" aria-label="Increase quantity">+</button>
          </div>
          <span style="font-family:var(--font-mono); font-size:.78rem; color:var(--text-faint);">${inStock ? p.stock + " in stock" : "Out of stock"}</span>
        </div>
        <div class="pd-actions">
          <button class="btn btn-primary" id="add-to-cart-btn" ${inStock ? "" : "disabled"}>Add to cart</button>
          <a href="checkout.html" class="btn btn-outline" id="buy-now-btn">Buy now</a>
        </div>
        <p class="stock-note">${inStock ? "\u2713 Ships within 24 hours" : ""}</p>
        <p class="pd-payment-note"><strong>Pay via M-PESA Till 3671768</strong>, Bank Transfer, or PayPal at checkout. Questions? <a href="https://wa.me/254725710624" target="_blank" rel="noopener" style="color:var(--accent);">WhatsApp us</a>.</p>
      </div>
    `;

    document.getElementById("qty-minus").addEventListener("click", () => {
      qty = Math.max(1, qty - 1);
      document.getElementById("qty-val").textContent = qty;
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qty = Math.min(p.stock || 99, qty + 1);
      document.getElementById("qty-val").textContent = qty;
    });
    document.getElementById("add-to-cart-btn").addEventListener("click", () => {
      addToCart(p, qty);
      const btn = document.getElementById("add-to-cart-btn");
      btn.textContent = "Added \u2713";
      setTimeout(() => (btn.textContent = "Add to cart"), 1200);
    });
    document.getElementById("buy-now-btn").addEventListener("click", () => {
      addToCart(p, qty);
    });
  }

  init();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products &mdash; Tech Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="Tech Hub"><span>TechHub</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html?category=laptops">Laptops</a>
      <a href="products.html?category=iphones">iPhones</a>
      <a href="products.html?category=samsung">Samsung</a>
      <a href="products.html" class="active">All Products</a>
    </nav>
    <div class="header-actions">
      <div class="search-mini">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="quick-search" placeholder="Search devices&hellip;">
      </div>
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
    </div>
  </div>
</header>

<main>
  <div class="wrap breadcrumb"><a href="index.html">Home</a> / <span id="crumb-label">All Products</span></div>

  <section class="products-section" style="padding-top:0;">
    <div class="wrap">
      <div class="section-head">
        <h2 id="page-title">All Products</h2>
        <span class="sub" id="result-count"></span>
      </div>
      <div class="filter-row">
        <button class="filter-chip" data-filter="all">All</button>
        <button class="filter-chip" data-filter="laptops">Laptops</button>
        <button class="filter-chip" data-filter="iphones">iPhones</button>
        <button class="filter-chip" data-filter="samsung">Samsung</button>
      </div>
      <div class="product-grid" id="product-grid">
        <p style="color:var(--text-faint); font-family:var(--font-mono); font-size:.8rem;">Loading products&hellip;</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>&copy; 2026 Tech Hub. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/products.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const initialCategory = params.get("category") || "all";
  const initialSearch = params.get("search") || "";

  const grid = document.getElementById("product-grid");
  const titleEl = document.getElementById("page-title");
  const crumbEl = document.getElementById("crumb-label");
  const countEl = document.getElementById("result-count");
  const labels = { all: "All Products", laptops: "Laptops", iphones: "iPhones", samsung: "Samsung" };

  document.querySelectorAll(".filter-chip").forEach((chip) => {
    if (chip.dataset.filter === initialCategory) chip.classList.add("active");
    chip.addEventListener("click", () => loadAndRender(chip.dataset.filter, ""));
  });

  if (initialSearch) {
    document.getElementById("quick-search").value = initialSearch;
  }
  document.getElementById("quick-search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") loadAndRender(initialCategory, e.target.value.trim());
  });

  async function loadAndRender(category, search) {
    document.querySelectorAll(".filter-chip").forEach((c) => c.classList.toggle("active", c.dataset.filter === category));
    titleEl.textContent = labels[category] || "All Products";
    crumbEl.textContent = labels[category] || "All Products";
    grid.innerHTML = `<p style="color:var(--text-faint); font-family:var(--font-mono); font-size:.8rem;">Loading products&hellip;</p>`;

    let products = await fetchProducts({ category });
    if (search) {
      const q = search.toLowerCase();
      products = products.filter((p) => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
    }
    countEl.textContent = products.length + " item" + (products.length === 1 ? "" : "s");

    if (products.length === 0) {
      grid.innerHTML = `<p style="color:var(--text-faint); font-family:var(--font-mono); font-size:.8rem;">No products found in this category yet.</p>`;
      return;
    }
    grid.innerHTML = products.map(productCard).join("");
    bindAddToCartButtons(grid, products);
  }

  loadAndRender(initialCategory, initialSearch);
</script>
</body>
</html>
